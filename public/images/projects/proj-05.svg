<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E1A26"/>
      <stop offset="100%" stop-color="#132B3A"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1.8" fill="rgba(76,235,224,0.12)"/>
    </pattern>
    <style>
      .ring-cyan {
        transform-box: fill-box;
        transform-origin: center;
        animation: spinCW 11s linear infinite;
      }
      .ring-pink {
        transform-box: fill-box;
        transform-origin: center;
        animation: spinCCW 7.5s linear infinite;
      }
      .core {
        transform-box: fill-box;
        transform-origin: center;
        animation: coreBeat 1.5s ease-in-out infinite;
      }
      .ticks-even {
        transform-box: fill-box;
        transform-origin: center;
        animation: tickPulse 1.5s ease-in-out infinite alternate;
      }
      .ticks-odd {
        transform-box: fill-box;
        transform-origin: center;
        animation: tickPulse 1.5s ease-in-out infinite alternate-reverse;
      }
      @keyframes spinCW { to { transform: rotate(360deg); } }
      @keyframes spinCCW { to { transform: rotate(-360deg); } }
      @keyframes coreBeat {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.16); }
      }
      @keyframes tickPulse {
        0% { transform: scale(0.95); opacity: 0.72; }
        100% { transform: scale(1.08); opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .ring-cyan, .ring-pink, .core, .ticks-even, .ticks-odd { animation: none; }
      }
    </style>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#dots)"/>

  <circle class="ring-cyan" cx="400" cy="255" r="115" fill="none" stroke="#4CEBE0" stroke-width="3" stroke-dasharray="28 12" opacity="0.88"/>
  <circle class="ring-pink" cx="400" cy="255" r="82" fill="none" stroke="#FF3E9D" stroke-width="2.5" stroke-dasharray="8 6"/>
  <circle class="core" cx="400" cy="255" r="46" fill="rgba(76,235,224,0.22)" stroke="#4CEBE0" stroke-width="2"/>
  <g stroke="#4CEBE0" stroke-width="6" stroke-linecap="round">
    <g class="ticks-even">
      <line x1="400" y1="100" x2="400" y2="132"/>
      <line x1="400" y1="378" x2="400" y2="410"/>
      <line x1="245" y1="255" x2="277" y2="255"/>
      <line x1="523" y1="255" x2="555" y2="255"/>
    </g>
    <g class="ticks-odd">
      <line x1="292" y1="147" x2="314" y2="169" stroke="#FF3E9D"/>
      <line x1="486" y1="341" x2="508" y2="363" stroke="#FF3E9D"/>
      <line x1="508" y1="147" x2="486" y2="169" stroke="#FF3E9D"/>
      <line x1="314" y1="341" x2="292" y2="363" stroke="#FF3E9D"/>
    </g>
  </g>

  <text x="48" y="64" font-family="monospace, sans-serif" font-size="18" font-weight="700" fill="#4CEBE0">05 // WEB AUDIO API</text>
  <text x="48" y="452" font-family="sans-serif" font-size="28" font-weight="700" fill="#E8FAF8">39 Hz Visualizer</text>
  <text x="752" y="452" text-anchor="end" font-family="monospace, sans-serif" font-size="16" fill="rgba(232,250,248,0.62)">MIKU.SPACE // ARCHIVE</text>
</svg>
