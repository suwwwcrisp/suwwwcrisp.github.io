<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E6FAF8"/>
      <stop offset="100%" stop-color="#C5F4EF"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1.8" fill="rgba(20,38,40,0.08)"/>
    </pattern>
    <style>
      .halo {
        transform-box: fill-box;
        transform-origin: center;
        animation: haloSpin 16s linear infinite;
      }
      .ring-outer {
        transform-box: fill-box;
        transform-origin: center;
        animation: ringPulse 3.6s ease-in-out infinite;
      }
      .ring-inner {
        transform-box: fill-box;
        transform-origin: center;
        animation: ringPulse 3.6s ease-in-out infinite -1.8s;
      }
      .gem {
        transform-box: fill-box;
        transform-origin: center;
        animation: gemBob 3.2s ease-in-out infinite;
      }
      .eq {
        transform-box: fill-box;
        transform-origin: bottom center;
      }
      .eq-1 { animation: eqBounce 1.15s ease-in-out infinite alternate; }
      .eq-2 { animation: eqBounce 0.92s ease-in-out infinite alternate -0.35s; }
      .eq-3 { animation: eqBounce 1.05s ease-in-out infinite alternate -0.6s; }
      .eq-4 { animation: eqBounce 1.28s ease-in-out infinite alternate -0.2s; }
      @keyframes haloSpin { to { transform: rotate(360deg); } }
      @keyframes ringPulse {
        0%, 100% { transform: scale(1); opacity: 0.78; }
        50% { transform: scale(1.06); opacity: 1; }
      }
      @keyframes gemBob {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-10px) scale(1.04); }
      }
      @keyframes eqBounce {
        0% { transform: scaleY(0.56); }
        100% { transform: scaleY(1.22); }
      }
      @media (prefers-reduced-motion: reduce) {
        .halo, .ring-outer, .ring-inner, .gem, .eq { animation: none; }
      }
    </style>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#dots)"/>

  <circle class="halo" cx="400" cy="240" r="140" fill="none" stroke="#39C5BB" stroke-width="2.5" stroke-dasharray="10 8" opacity="0.7"/>
  <ellipse class="ring-outer" cx="400" cy="335" rx="190" ry="38" fill="none" stroke="#39C5BB" stroke-width="3"/>
  <ellipse class="ring-inner" cx="400" cy="335" rx="135" ry="24" fill="rgba(57,197,187,0.16)" stroke="#E12885" stroke-width="2"/>
  <g class="gem">
    <polygon points="400,120 475,240 400,325 325,240" fill="rgba(57,197,187,0.22)" stroke="#1E9E96" stroke-width="2.5"/>
    <polygon points="400,145 450,235 400,300 350,235" fill="rgba(255,255,255,0.65)" stroke="#39C5BB" stroke-width="2"/>
  </g>
  <rect class="eq eq-1" x="145" y="290" width="16" height="65" rx="8" fill="#39C5BB" opacity="0.7"/>
  <rect class="eq eq-2" x="172" y="260" width="16" height="95" rx="8" fill="#39C5BB"/>
  <rect class="eq eq-3" x="612" y="255" width="16" height="100" rx="8" fill="#E12885" opacity="0.85"/>
  <rect class="eq eq-4" x="639" y="285" width="16" height="70" rx="8" fill="#39C5BB" opacity="0.7"/>

  <text x="48" y="64" font-family="monospace, sans-serif" font-size="18" font-weight="700" fill="#39C5BB">01 // THREE.JS STAGE</text>
  <text x="48" y="452" font-family="sans-serif" font-size="28" font-weight="700" fill="#142628">Miku 3D Stage</text>
  <text x="752" y="452" text-anchor="end" font-family="monospace, sans-serif" font-size="16" fill="rgba(20,38,40,0.58)">MIKU.SPACE // ARCHIVE</text>
</svg>
