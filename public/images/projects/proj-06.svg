<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111927"/>
      <stop offset="100%" stop-color="#1B2738"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1.8" fill="rgba(76,235,224,0.12)"/>
    </pattern>
    <style>
      .dot-r { animation: dotPulse 2.4s ease-in-out infinite; }
      .dot-y { animation: dotPulse 2.4s ease-in-out infinite -0.4s; }
      .dot-g { animation: dotPulse 2.4s ease-in-out infinite -0.8s; }
      .cursor { animation: cursorBlink 1.1s steps(2, start) infinite; }
      .live-line { animation: liveGlow 2.2s ease-in-out infinite alternate; }
      @keyframes dotPulse {
        0%, 100% { opacity: 0.72; }
        50% { opacity: 1; }
      }
      @keyframes cursorBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes liveGlow {
        0% { opacity: 0.76; }
        100% { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .dot-r, .dot-y, .dot-g, .cursor, .live-line { animation: none; }
      }
    </style>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#dots)"/>

  <rect x="145" y="125" width="510" height="255" rx="20" fill="#0B111C" stroke="#39C5BB" stroke-width="2.5"/>
  <circle class="dot-r" cx="180" cy="155" r="7" fill="#FF5F56"/>
  <circle class="dot-y" cx="204" cy="155" r="7" fill="#FFBD2E"/>
  <circle class="dot-g" cx="228" cy="155" r="7" fill="#27C93F"/>
  <text x="180" y="212" font-family="monospace" font-size="22" fill="#4CEBE0">$ npx miku-pages deploy</text>
  <rect class="cursor" x="502" y="193" width="12" height="22" rx="2" fill="#4CEBE0"/>
  <text x="180" y="252" font-family="monospace" font-size="18" fill="#8FA8B8">✓ vite build  (392ms)</text>
  <text x="180" y="286" font-family="monospace" font-size="18" fill="#8FA8B8">✓ glb assets  verified</text>
  <text class="live-line" x="180" y="324" font-family="monospace" font-size="20" fill="#66E3A4">➜ Live at https://user.github.io/</text>

  <text x="48" y="64" font-family="monospace, sans-serif" font-size="18" font-weight="700" fill="#39C5BB">06 // CLI &amp; AUTOMATION</text>
  <text x="48" y="452" font-family="sans-serif" font-size="28" font-weight="700" fill="#E8FAF8">Pages Deploy Kit</text>
  <text x="752" y="452" text-anchor="end" font-family="monospace, sans-serif" font-size="16" fill="rgba(232,250,248,0.62)">MIKU.SPACE // ARCHIVE</text>
</svg>
