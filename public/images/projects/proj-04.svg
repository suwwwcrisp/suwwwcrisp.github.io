<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF2F7"/>
      <stop offset="100%" stop-color="#FFE2EE"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1.8" fill="rgba(20,38,40,0.08)"/>
    </pattern>
    <style>
      .sprite {
        transform-box: fill-box;
        transform-origin: center bottom;
        animation: pixelHop 2.2s ease-in-out infinite;
      }
      .swatch {
        transform-box: fill-box;
        transform-origin: center;
      }
      .sw-1 { animation: swPop 1.8s ease-in-out infinite; }
      .sw-2 { animation: swPop 1.8s ease-in-out infinite -0.45s; }
      .sw-3 { animation: swPop 1.8s ease-in-out infinite -0.9s; }
      .sw-4 { animation: swPop 1.8s ease-in-out infinite -1.35s; }
      @keyframes pixelHop {
        0%, 100% { transform: translateY(0) rotate(-3deg); }
        50% { transform: translateY(-14px) rotate(3deg); }
      }
      @keyframes swPop {
        0%, 100% { transform: scale(1); }
        40% { transform: scale(1.18); }
      }
      @media (prefers-reduced-motion: reduce) {
        .sprite, .swatch { animation: none; }
      }
    </style>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#dots)"/>

  <rect x="165" y="125" width="260" height="260" rx="20" fill="rgba(255,255,255,0.85)" stroke="#E12885" stroke-width="2.5"/>
  <g transform="translate(205,165)">
    <g class="sprite">
      <rect x="0" y="0" width="36" height="36" fill="#39C5BB"/>
      <rect x="36" y="0" width="36" height="36" fill="#8CF4EC"/>
      <rect x="72" y="0" width="36" height="36" fill="#39C5BB"/>
      <rect x="108" y="0" width="36" height="36" fill="#219A92"/>
      <rect x="144" y="0" width="36" height="36" fill="#39C5BB"/>
      <rect x="0" y="36" width="36" height="36" fill="#E12885"/>
      <rect x="36" y="36" width="36" height="36" fill="#FFE7D9"/>
      <rect x="72" y="36" width="36" height="36" fill="#FFE7D9"/>
      <rect x="108" y="36" width="36" height="36" fill="#FFE7D9"/>
      <rect x="144" y="36" width="36" height="36" fill="#E12885"/>
      <rect x="36" y="72" width="36" height="36" fill="#199A94"/>
      <rect x="72" y="72" width="36" height="36" fill="#FFE7D9"/>
      <rect x="108" y="72" width="36" height="36" fill="#199A94"/>
      <rect x="36" y="108" width="108" height="36" fill="#39C5BB"/>
    </g>
  </g>
  <rect x="465" y="155" width="170" height="200" rx="18" fill="rgba(255,255,255,0.82)" stroke="#39C5BB" stroke-width="2"/>
  <circle class="swatch sw-1" cx="515" cy="210" r="22" fill="#39C5BB"/>
  <circle class="swatch sw-2" cx="575" cy="210" r="22" fill="#E12885"/>
  <circle class="swatch sw-3" cx="515" cy="270" r="22" fill="#8CF4EC"/>
  <circle class="swatch sw-4" cx="575" cy="270" r="22" fill="#142628"/>

  <text x="48" y="64" font-family="monospace, sans-serif" font-size="18" font-weight="700" fill="#E12885">04 // PIXEL TOOLKIT</text>
  <text x="48" y="452" font-family="sans-serif" font-size="28" font-weight="700" fill="#142628">Sprite Atlas Maker</text>
  <text x="752" y="452" text-anchor="end" font-family="monospace, sans-serif" font-size="16" fill="rgba(20,38,40,0.58)">MIKU.SPACE // ARCHIVE</text>
</svg>
