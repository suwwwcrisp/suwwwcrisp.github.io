<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F1FAF9"/>
      <stop offset="100%" stop-color="#E1F3F2"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1.8" fill="rgba(20,38,40,0.08)"/>
    </pattern>
    <style>
      .orb-a { animation: orbDriftA 6s ease-in-out infinite alternate; }
      .orb-b { animation: orbDriftB 7.4s ease-in-out infinite alternate; }
      .glass-back { animation: glassBack 4.7s ease-in-out infinite alternate; }
      .glass-front { animation: glassFront 3.8s ease-in-out infinite alternate; }
      .cta-pulse {
        transform-box: fill-box;
        transform-origin: center;
        animation: ctaPulse 2.4s ease-in-out infinite;
      }
      @keyframes orbDriftA {
        0% { transform: translate(-14px, -10px) scale(0.95); }
        100% { transform: translate(18px, 14px) scale(1.08); }
      }
      @keyframes orbDriftB {
        0% { transform: translate(16px, 12px) scale(1.06); }
        100% { transform: translate(-18px, -12px) scale(0.94); }
      }
      @keyframes glassBack {
        0% { transform: translate(-8px, -6px); }
        100% { transform: translate(10px, 8px); }
      }
      @keyframes glassFront {
        0% { transform: translate(8px, 6px); }
        100% { transform: translate(-8px, -8px); }
      }
      @keyframes ctaPulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.07); }
      }
      @media (prefers-reduced-motion: reduce) {
        .orb-a, .orb-b, .glass-back, .glass-front, .cta-pulse { animation: none; }
      }
    </style>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#dots)"/>

  <circle class="orb-a" cx="290" cy="210" r="85" fill="#39C5BB" opacity="0.32"/>
  <circle class="orb-b" cx="505" cy="285" r="95" fill="#E12885" opacity="0.22"/>
  <rect class="glass-back" x="170" y="135" width="310" height="190" rx="26" fill="rgba(255,255,255,0.68)" stroke="rgba(255,255,255,0.95)" stroke-width="3"/>
  <g class="glass-front">
    <rect x="320" y="175" width="310" height="190" rx="26" fill="rgba(255,255,255,0.58)" stroke="#39C5BB" stroke-width="2.5"/>
    <rect x="355" y="212" width="150" height="18" rx="9" fill="#39C5BB"/>
    <rect x="355" y="246" width="235" height="14" rx="7" fill="#142628" opacity="0.22"/>
    <rect x="355" y="272" width="190" height="14" rx="7" fill="#142628" opacity="0.16"/>
    <rect class="cta-pulse" x="355" y="305" width="94" height="32" rx="16" fill="#E12885" opacity="0.88"/>
  </g>

  <text x="48" y="64" font-family="monospace, sans-serif" font-size="18" font-weight="700" fill="#39C5BB">03 // DESIGN SYSTEM</text>
  <text x="48" y="452" font-family="sans-serif" font-size="28" font-weight="700" fill="#142628">Liquid Glass UI Kit</text>
  <text x="752" y="452" text-anchor="end" font-family="monospace, sans-serif" font-size="16" fill="rgba(20,38,40,0.58)">MIKU.SPACE // ARCHIVE</text>
</svg>
